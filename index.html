<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platform Decision Tool</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@0.379.0/dist/umd/lucide.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #F4F3EF; color: #1A1917; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Definerer komponenter fra bibliotekene
        const { useState, useEffect } = React;
        const { BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer, Cell } = Recharts;

        // Farger og stiler
        const C = {
            bg:"#F4F3EF", surface:"#FFFFFF", raised:"#EDECEA", border:"#DDD9D0", borderHi:"#C4C0B6",
            text:"#1A1917", sub:"#5C5B54", muted:"#9A9890",
            green:"#0D7A56", greenBg:"#E6F5EE", greenBd:"#A8DCC4",
            red:"#B83820",   redBg:"#FDF0EC",   redBd:"#F0B8A4",
            amber:"#8C6200", amberBg:"#FDF6E0", amberBd:"#E8CC7A",
            blue:"#1856A0",  blueBg:"#EBF2FF",  blueBd:"#A8C4F0",
            sh:"0 1px 3px rgba(0,0,0,0.07)", shMd:"0 4px 12px rgba(0,0,0,0.09)",
        };

        const IS = { width:"100%", background:"#FFFFFF", border:"1.5px solid #DDD9D0", borderRadius:8, padding:"9px 12px", color:"#1A1917", fontSize:14, outline:"none", boxSizing:"border-box", fontFamily:"inherit" };
        const fmt = n => Math.round(n).toLocaleString("nb-NO");
        const emptyD = () => ({ ideology:0, competence:0, working_env:0, user_sat:0, reputation:0, infra:0, shadow_it:0, technical:0, governance:0 });
        const netDebt = d => Object.values(d||{}).reduce((a,b)=>a+b, 0);
        const orientLabel = v => v<30?"Primært exploitasjon":v<45?"Overvekt exploitasjon":v<=55?"Balansert":v<70?"Overvekt explorasjon":"Primært explorasjon";

        const DEBTS = [
            {k:"ideology",    n:"Ideologi",         s:"Ideologi",    d:"Teknologibias og leverandørpreferanser"},
            {k:"competence",  n:"Kompetanse",        s:"Kompetanse",  d:"Kompetanse, opplæring og kognitiv belastning"},
            {k:"working_env", n:"Arbeidsmiljø",      s:"Arbeidsmiljø",d:"Kultur, DevEx og absorbsjonsevne"},
            {k:"user_sat",    n:"Brukertilfredshet", s:"Brukertilf.", d:"Sluttbrukernes opplevelse av IT-leveransen"},
            {k:"reputation",  n:"Omdømme",           s:"Omdømme",     d:"Tillit til IT-funksjonen over tid"},
            {k:"infra",       n:"Infrastruktur",     s:"Infra",       d:"Driftsintensitet, IaC-gjeld og lock-in"},
            {k:"shadow_it",   n:"Shadow IT",         s:"Shadow IT",   d:"Workarounds utenfor plattformens kontroll"},
            {k:"technical",   n:"Teknisk gjeld",     s:"Teknisk",     d:"Dokumentasjon, automatisering og vedlikehold"},
            {k:"governance",  n:"Governance",        s:"Governance",  d:"Beslutningsstrukturer og compliance-overhead"}
        ];

        const TYPES = {
            tech:    { l:"Teknologivalg",    e:"⚙️", desc:"Tekniske løsninger og plattformer", ph:"F.eks. Azure Firewall" },
            org:     { l:"Organisasjonsvalg",e:"🏗️", desc:"Teamstruktur og kompetansemodell", ph:"F.eks. Plattformteam" },
            process: { l:"Prosessvalg",      e:"🔄", desc:"Arbeidsmetodikk og leveranse", ph:"F.eks. CI/CD-pipeline" },
            design:  { l:"Designvalg",       e:"🧩", desc:"Arkitektur og endringsevne", ph:"F.eks. API-first integrasjon" }
        };

        const EFFECTS = {
            tech:    ["Reduserer driftsoverhead","Øker automatisering","Frigjør intern kapasitet","Reduserer teknisk gjeld"],
            org:     ["Sentralisering av beslutninger","Desentralisering / økt autonomi","Redusert kognitiv belastning","Styrket innovasjonsevne"],
            process: ["Kortere leveransetid","Redusert manuelt arbeid","Bedre compliance-håndtering","Redusert endringsrisiko"],
            design:  ["Løsere kobling","Bedre skalerbarhet","Økt gjenbruk","Redusert kompleksitet"]
        };

        const PHASES = ["Assimilering","Rekonstruksjon","Materialisering"];
        const TENSIONS = [
            {k:"alignment", l:"Alignment", d:"Forretningstransformasjon ↔ Medarbeidertransformasjon"},
            {k:"change", l:"Endring", d:"Radikal innovasjon ↔ Inkrementell innovasjon"},
            {k:"knowledge", l:"Kunnskap", d:"Anskaffe ny kompetanse ↔ Vedlikeholde eksisterende"},
            {k:"delivery", l:"Leveranse", d:"Ny infrastruktur ↔ Legacy-miljø"},
            {k:"risk", l:"Risiko", d:"Innovasjon ↔ Compliance og kontroll"}
        ];

        // Helper for Lucide Ikoner i CDN-versjon
        const Icon = ({ name, size = 16, style = {}, className = "" }) => {
            useEffect(() => { lucide.createIcons(); }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size, display: 'inline-block', ...style }} className={className}></i>;
        };

        // Hovedkomponent
        function PlatformDebtTool() {
            const [view, setView] = useState("dashboard");
            const [selectedId, setSelectedId] = useState(null);
            
            // Laster inn fra LocalStorage om det finnes, ellers bruk standard
            const [decisions, setDecisions] = useState(() => {
                const saved = localStorage.getItem("platform_decisions");
                if (saved) return JSON.parse(saved);
                return [
                    {
                        id: "1", name: "Azure Managed Firewall", type: "tech",
                        what: "Erstatte nåværende manuelle Linux-brannmurer med helforvaltet infrastruktur.",
                        effect: "Reduserer driftsoverhead", replaces: "Manuelle Linux-brannmurer",
                        phase: "Assimilering", tension: "risk", orient: null, notes: "Reduserer Toil på sikt.",
                        debts: { ideology: 1, competence: -1, working_env: -2, user_sat: 0, reputation: 1, infra: -3, shadow_it: -1, technical: -2, governance: 1 },
                        cost: 450000, hours: 140, hourRate: 1100, horizons: 8, prob: 0.85, absorb: 0.7, xv: 749700, eff: 1.66
                    }
                ];
            });

            // Lagre til LocalStorage hver gang listen endres
            useEffect(() => {
                localStorage.setItem("platform_decisions", JSON.stringify(decisions));
            }, [decisions]);

            const saveNew = form => {
                const newD = {
                    ...form, id: Date.now().toString(), phase: null, tension: null, orient: null, notes: "",
                    cost: "", hours: "", hourRate: 1100, horizons: 8, prob: 0.7, absorb: 0.6, xv: 0, eff: null
                };
                setDecisions([...decisions, newD]);
            };

            const del = id => {
                setDecisions(decisions.filter(d => d.id !== id));
                if(selectedId === id) setView("dashboard");
            };

            const update = (id, fields) => {
                setDecisions(decisions.map(d => d.id === id ? { ...d, ...fields } : d));
            };

            const tD = decisions.reduce((s,d) => s + netDebt(d.debts), 0);
            const tXV = decisions.reduce((s,d) => s + (d.xv||0), 0);
            const tCost = decisions.reduce((s,d) => s + (d.cost||0), 0);
            const xvEff = tCost > 0 ? tXV / tCost : null;

            const catTot = {};
            DEBTS.forEach(d => { catTot[d.k] = 0 });
            decisions.forEach(d => DEBTS.forEach(c => { catTot[c.k] += (d.debts?.[c.k] || 0) }));
            const chartData = DEBTS.map(c => ({ name:c.s, verdi:catTot[c.k] }));

            const currentD = decisions.find(d => d.id === selectedId);

            return (
                <div style={{ minHeight:"100vh", background:C.bg, color:C.text }}>
                    <header style={{ background:C.surface, borderBottom:`1px solid ${C.border}`, padding:"14px 24px", display:"flex", alignItems:"center", justifyContent:"space-between", boxShadow:C.sh }}>
                        <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                            <div style={{ width:30, height:30, borderRadius:8, background:C.green, display:"flex", alignItems:"center", justifyContent:"center" }}>
                                <span style={{ color:"#FFF", fontSize:14, fontWeight:800 }}>P</span>
                            </div>
                            <span style={{ fontSize:15, fontWeight:700 }}>Platform Decision Tool</span>
                            <span style={{ fontSize:12, color:C.muted }}>· Sky-lagret lokalt</span>
                        </div>
                        <span style={{ fontSize:12, color:C.muted }}>{decisions.length} valg registrert</span>
                    </header>

                    <main style={{ maxWidth:980, margin:"0 auto", padding:"32px 28px" }}>
                        {view === "dashboard" && (
                            <div>
                                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr 1fr", gap:14, marginBottom:24 }}>
                                    <div style={{ background:C.surface, padding:14, borderRadius:10, border:`1px solid ${C.border}` }}>
                                        <div style={{ fontSize:10, fontWeight:700, color:C.muted }}>ANTALL VALG</div>
                                        <div style={{ fontSize:18, fontWeight:700 }}>{decisions.length}</div>
                                    </div>
                                    <div style={{ background:tD>0?C.redBg:C.greenBg, padding:14, borderRadius:10, border:`1px solid ${C.border}` }}>
                                        <div style={{ fontSize:10, fontWeight:700, color:C.muted }}>AKKUMULERT GJELD</div>
                                        <div style={{ fontSize:18, fontWeight:700, color:tD>0?C.red:C.green }}>{(tD>0?"+":"")+tD}</div>
                                    </div>
                                    <div style={{ background:C.greenBg, padding:14, borderRadius:10, border:`1px solid ${C.border}` }}>
                                        <div style={{ fontSize:10, fontWeight:700, color:C.muted }}>TOTAL XV VERDI</div>
                                        <div style={{ fontSize:18, fontWeight:700, color:C.green }}>kr {fmt(tXV)}</div>
                                    </div>
                                    <div style={{ background:C.surface, padding:14, borderRadius:10, border:`1px solid ${C.border}` }}>
                                        <div style={{ fontSize:10, fontWeight:700, color:C.muted }}>EFFEKTIVITET</div>
                                        <div style={{ fontSize:18, fontWeight:700 }}>{xvEff ? xvEff.toFixed(2)+"x" : "—"}</div>
                                    </div>
                                </div>

                                <div style={{ display:"flex", justifyContent:"space-between", marginBottom:20 }}>
                                    <h3 style={{ margin:0 }}>Porteføljeoversikt</h3>
                                    <button onClick={() => setView("wizard")} style={{ background:C.green, color:"#FFF", border:"none", padding:"10px 18px", borderRadius:8, fontWeight:600, cursor:"pointer" }}>
                                        + Registrer nytt plattformvalg
                                    </button>
                                </div>

                                <div style={{ display:"grid", gridTemplateColumns:"1fr", gap:20 }}>
                                    <div style={{ background:C.surface, borderRadius:12, padding:16, border:`1px solid ${C.border}` }}>
                                        <table style={{ width:"100%", borderCollapse:"collapse", textAlign:"left" }}>
                                            <thead>
                                                <tr style={{ borderBottom:`1px solid ${C.border}`, color:C.sub, fontSize:12 }}>
                                                    <th style={{ padding:10 }}>Navn</th>
                                                    <th style={{ padding:10 }}>Nettogjeld</th>
                                                    <th style={{ padding:10 }}>Forventet Verdi (xV)</th>
                                                    <th style={{ padding:10, width:40 }}></th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {decisions.map(d => (
                                                    <tr key={d.id} style={{ borderBottom:`1px solid ${C.raised}`, cursor:"pointer" }} onClick={() => { setSelectedId(d.id); setView("detail"); }}>
                                                        <td style={{ padding:12, fontWeight:600 }}>{d.name}</td>
                                                        <td style={{ padding:12, fontWeight:700, color:netDebt(d.debts)>0?C.red:C.green }}>{(netDebt(d.debts)>0?"+":"")+netDebt(d.debts)}</td>
                                                        <td style={{ padding:12, color:C.green, fontWeight:600 }}>kr {fmt(d.xv||0)}</td>
                                                        <td style={{ padding:12 }} onClick={e => e.stopPropagation()}>
                                                            <button onClick={() => del(d.id)} style={{ background:"none", border:"none", color:C.muted, cursor:"pointer" }}>
                                                                <Icon name="trash-2" size={14} />
                                                            </button>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === "wizard" && (
                            <div style={{ background:C.surface, padding:24, borderRadius:12, border:`1px solid ${C.border}`, maxWidth:500, margin:"0 auto" }}>
                                <h3>Nytt plattformvalg</h3>
                                <div style={{ marginBottom:14 }}>
                                    <label style={{ fontSize:12, fontWeight:700 }}>TITTEL</label>
                                    <input type="text" id="w_name" style={IS} placeholder="F.eks. Ny skyløsning" />
                                </div>
                                <div style={{ marginBottom:14 }}>
                                    <label style={{ fontSize:12, fontWeight:700 }}>TYPE</label>
                                    <select id="w_type" style={IS}>
                                        <option value="tech">Teknologivalg</option>
                                        <option value="org">Organisasjonsvalg</option>
                                    </select>
                                </div>
                                <div style={{ display:"flex", gap:10, marginTop:20 }}>
                                    <button onClick={() => setView("dashboard")} style={{ flex:1, padding:10, background:C.raised, border:"none", borderRadius:8, cursor:"pointer" }}>Avbryt</button>
                                    <button onClick={() => {
                                        const name = document.getElementById("w_name").value;
                                        const type = document.getElementById("w_type").value;
                                        if(name) {
                                            saveNew({ name, type, what: "", effect: "Reduserer driftsoverhead", replaces: "", debts: emptyD() });
                                            setView("dashboard");
                                        }
                                    }} style={{ flex:1, padding:10, background:C.green, color:"#FFF", border:"none", borderRadius:8, cursor:"pointer", fontWeight:600 }}>Lagre</button>
                                </div>
                            </div>
                        )}

                        {view === "detail" && currentD && (
                            <div style={{ background:C.surface, padding:24, borderRadius:12, border:`1px solid ${C.border}` }}>
                                <button onClick={() => setView("dashboard")} style={{ marginBottom:14, background:"none", border:"none", color:C.sub, cursor:"pointer", display:"flex", alignItems:"center", gap:6 }}>
                                    <Icon name="arrow-left" size={14} /> Tilbake til oversikten
                                </button>
                                <h2>{currentD.name}</h2>
                                <p style={{ color:C.sub }}>Type: {currentD.type === "tech" ? "Teknologivalg" : "Organisasjonsvalg"}</p>
                                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:20, marginTop:20 }}>
                                    <div>
                                        <h4>Gjeldskonfigurasjon (Workshop score)</h4>
                                        {DEBTS.map(cat => (
                                            <div key={cat.k} style={{ marginBottom:10 }}>
                                                <div style={{ display:"flex", justifyContent:"space-between", fontSize:13 }}>
                                                    <span>{cat.n}</span>
                                                    <span style={{ fontWeight:700 }}>{currentD.debts[cat.k] || 0}</span>
                                                </div>
                                                <input type="range" min="-5" max="5" value={currentD.debts[cat.k] || 0} 
                                                    onChange={e => {
                                                        const val = parseInt(e.target.value);
                                                        const updatedDebts = { ...currentD.debts, [cat.k]: val };
                                                        update(currentD.id, { debts: updatedDebts });
                                                    }} style={{ width:"100%" }} />
                                            </div>
                                        ))}
                                    </div>
                                    <div>
                                        <h4>Økonomisk verdiutbytte (xV)</h4>
                                        <div style={{ marginBottom:12 }}>
                                            <label style={{ fontSize:12 }}>Implementasjonskostnad (kr)</label>
                                            <input type="number" value={currentD.cost || ""} onChange={e => {
                                                const cost = parseFloat(e.target.value) || 0;
                                                const xv = (currentD.hours || 0) * (currentD.hourRate || 1100) * (currentD.horizons || 8) * (currentD.prob || 0.7) * (currentD.absorb || 0.6);
                                                update(currentD.id, { cost, xv, eff: cost > 0 ? xv / cost : null });
                                            }} style={IS} />
                                        </div>
                                        <div style={{ marginBottom:12 }}>
                                            <label style={{ fontSize:12 }}>Frigjorte timer pr. kvartal</label>
                                            <input type="number" value={currentD.hours || ""} onChange={e => {
                                                const hours = parseFloat(e.target.value) || 0;
                                                const xv = hours * (currentD.hourRate || 1100) * (currentD.horizons || 8) * (currentD.prob || 0.7) * (currentD.absorb || 0.6);
                                                update(currentD.id, { hours, xv, eff: (currentD.cost || 0) > 0 ? xv / currentD.cost : null });
                                            }} style={IS} />
                                        </div>
                                        <div style={{ background:C.raised, padding:14, borderRadius:8, marginTop:20 }}>
                                            <div style={{ fontSize:12, color:C.sub }}>BEREGNET VERDI (xV):</div>
                                            <div style={{ fontSize:20, fontWeight:700, color:C.green }}>kr {fmt(currentD.xv || 0)}</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PlatformDebtTool />);
    </script>
</body>
</html>
