<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platform Decision Tool</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@0.379.0/dist/umd/lucide.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #F4F3EF; color: #1A1917; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // ── Henter funksjoner fra bibliotekene (erstatter imports) ────────────
        const { useState, useEffect } = React;
        const { BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer, Cell } = Recharts;

        // ── Ikon-hjelper for nettleseren ──────────────────────────────────────
        const Icon = ({ name, size = 16, style = {}, className = "" }) => {
            useEffect(() => { if(window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size, display: 'inline-block', ...style }} className={className}></i>;
        };

        // ── Farger og stiler ──────────────────────────────────────────────────
        const C = {
            bg:"#F4F3EF", surface:"#FFFFFF", raised:"#EDECEA", border:"#DDD9D0", borderHi:"#C4C0B6",
            text:"#1A1917", sub:"#5C5B54", muted:"#9A9890",
            green:"#0D7A56", greenBg:"#E6F5EE", greenBd:"#A8DCC4",
            red:"#B83820",   redBg:"#FDF0EC",   redBd:"#F0B8A4",
            amber:"#8C6200", amberBg:"#FDF6E0", amberBd:"#E8CC7A",
            blue:"#1856A0",  blueBg:"#EBF2FF",  blueBd:"#A8C4F0",
            sh:"0 1px 3px rgba(0,0,0,0.07)", shMd:"0 4px 12px rgba(0,0,0,0.09)",
        };

        const IS = { width:"100%", background:"#FFFFFF", border:"1.5px solid #DDD9D0", borderRadius:8, padding:"9px 12px", color:"#1A1917", fontSize:14, outline:"none", boxSizing:"border-box", fontFamily:"inherit" };
        const fmt = n => Math.round(n).toLocaleString("nb-NO");
        const emptyD = () => ({ ideology:0, competence:0, working_env:0, user_sat:0, reputation:0, infra:0, shadow_it:0, technical:0, governance:0 });
        const netDebt = d => Object.values(d||{}).reduce((a,b)=>a+b, 0);
        const orientLabel = v => v<30?"Primært exploitasjon":v<45?"Overvekt exploitasjon":v<=55?"Balansert":v<70?"Overvekt explorasjon":"Primært explorasjon";

        // ── Data og Konfigurasjon ─────────────────────────────────────────────
        const DEBTS = [
            {k:"ideology",    n:"Ideologi",         s:"Ideologi",    d:"Teknologibias og leverandørpreferanser"},
            {k:"competence",  n:"Kompetanse",        s:"Kompetanse",  d:"Kompetanse, opplæring og kognitiv belastning"},
            {k:"working_env", n:"Arbeidsmiljø",      s:"Arbeidsmiljø",d:"Kultur, DevEx og absorbsjonsevne"},
            {k:"user_sat",    n:"Brukertilfredshet", s:"Brukertilf.", d:"Sluttbrukernes opplevelse av IT-leveransen"},
            {k:"reputation",  n:"Omdømme",           s:"Omdømme",     d:"Tillit til IT-funksjonen over tid"},
            {k:"infra",       n:"Infrastruktur",     s:"Infra",       d:"Driftsintensitet, IaC-gjeld og lock-in"},
            {k:"shadow_it",   n:"Shadow IT",         s:"Shadow IT",   d:"Workarounds utenfor plattformens kontroll"},
            {k:"technical",   n:"Teknisk gjeld",     s:"Teknisk",     d:"Dokumentasjon, automatisering og vedlikehold"},
            {k:"governance",  n:"Governance",        s:"Governance",  d:"Beslutningsstrukturer og compliance-overhead"}
        ];

        const TYPES = {
            tech:    { l:"Teknologivalg",    e:"⚙️", desc:"Tekniske løsninger og plattformer", ph:"F.eks. Azure Firewall" },
            org:     { l:"Organisasjonsvalg",e:"🏗️", desc:"Teamstruktur og kompetansemodell", ph:"F.eks. Plattformteam" },
            process: { l:"Prosessvalg",      e:"🔄", desc:"Arbeidsmetodikk og leveranse", ph:"F.eks. CI/CD-pipeline" },
            design:  { l:"Designvalg",       e:"🧩", desc:"Arkitektur og endringsevne", ph:"F.eks. API-first integrasjon" }
        };

        const EFFECTS = {
            tech:    ["Reduserer driftsoverhead","Øker automatisering","Frigjør intern kapasitet","Muliggjør ny kapabilitet"],
            org:     ["Sentralisering av beslutninger","Desentralisering / økt autonomi","Redusert kognitiv belastning"],
            process: ["Kortere leveransetid","Redusert manuelt arbeid","Bedre compliance-håndtering","Redusert endringsrisiko"],
            design:  ["Løsere kobling","Bedre skalerbarhet","Økt gjenbruk","Redusert kompleksitet"]
        };

        const TENSIONS = [
            {k:"alignment", l:"Alignment", d:"Forretningstransformasjon ↔ Medarbeidertransformasjon"},
            {k:"change", l:"Endring", d:"Radikal innovasjon ↔ Inkrementell innovasjon"},
            {k:"knowledge", l:"Kunnskap", d:"Anskaffe ny kompetanse ↔ Vedlikeholde eksisterende"},
            {k:"delivery", l:"Leveranse", d:"Ny infrastruktur ↔ Legacy-miljø"},
            {k:"risk", l:"Risiko", d:"Innovasjon ↔ Compliance og kontroll"}
        ];

        const PHASES = ["Assimilering","Rekonstruksjon","Materialisering"];

        const suggestOrient = d => {
            let s = 50;
            if (["Reduserer driftsoverhead","Kortere leveransetid"].includes(d.effect)) s -= 25;
            else if (["Muliggjør ny kapabilitet","Bedre skalerbarhet"].includes(d.effect)) s += 25;
            const nd = netDebt(d.debts);
            if (nd < -2) s -= 8;
            if (nd > 3)  s += 8;
            return Math.max(5, Math.min(95, Math.round(s)));
        };
        const getOrient = d => d.orient != null ? d.orient : suggestOrient(d);

        // ── UI Komponenter ────────────────────────────────────────────────────
        function Lbl({ t, hint }) {
            return (
                <div style={{ marginBottom:6 }}>
                    <div style={{ fontSize:11, fontWeight:700, color:C.sub, textTransform:"uppercase", letterSpacing:"0.07em" }}>{t}</div>
                    {hint && <div style={{ fontSize:11, color:C.muted, marginTop:1, lineHeight:1.4 }}>{hint}</div>}
                </div>
            );
        }

        function Card({ children, style={} }) {
            return <div style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:12, boxShadow:C.sh, ...style }}>{children}</div>;
        }

        function Tag({ color, text }) {
            const m = { green:[C.greenBg,C.green,C.greenBd], blue:[C.blueBg,C.blue,C.blueBd], amber:[C.amberBg,C.amber,C.amberBd] };
            const [bg,tc,bd] = m[color] || m.green;
            return <span style={{ fontSize:11, padding:"3px 10px", borderRadius:20, fontWeight:600, background:bg, color:tc, border:`1px solid ${bd}` }}>{text}</span>;
        }

        function TypeBadge({ type }) {
            const m = { tech:[C.blueBg,C.blue,C.blueBd], org:["#F0EBFF","#5030A0","#C8B0F0"], process:[C.greenBg,C.green,C.greenBd], design:[C.amberBg,C.amber,C.amberBd] };
            const [bg,tc,bd] = m[type] || m.tech;
            return <span style={{ fontSize:11, padding:"3px 10px", borderRadius:20, fontWeight:600, background:bg, color:tc, border:`1px solid ${bd}` }}>{TYPES[type]?.l || "Valg"}</span>;
        }

        function Tip({ color, text }) {
            const m = { green:[C.greenBg,C.greenBd,C.green,"check-circle"], red:[C.redBg,C.redBd,C.red,"alert-triangle"], amber:[C.amberBg,C.amberBd,C.amber,"info"] };
            const [bg,bd,tc,iconName] = m[color] || m.amber;
            return (
                <div style={{ display:"flex", gap:10, background:bg, border:`1px solid ${bd}`, borderRadius:10, padding:"11px 15px", fontSize:13, color:tc, lineHeight:1.6, marginTop:12 }}>
                    <Icon name={iconName} size={15} style={{ flexShrink:0, marginTop:2 }} /><span>{text}</span>
                </div>
            );
        }

        function ChartTT({ active, payload, label }) {
            if (!active || !payload?.length) return null;
            const v = payload[0].value;
            return (
                <div style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:8, padding:"9px 13px", fontSize:12, boxShadow:C.shMd }}>
                    <div style={{ color:C.sub, marginBottom:3, fontWeight:600 }}>{label}</div>
                    <div style={{ fontWeight:700, fontSize:15, color:v<0?C.green:v>0?C.red:C.muted }}>{v>0?"+":""}{v}</div>
                </div>
            );
        }

        function Stat({ label, value, sub, color, bg }) {
            return (
                <div style={{ background:bg||C.raised, border:`1px solid ${C.border}`, borderRadius:10, padding:"12px 14px", textAlign:"center" }}>
                    <div style={{ fontSize:10, fontWeight:700, color:C.muted, textTransform:"uppercase", letterSpacing:"0.07em", marginBottom:5 }}>{label}</div>
                    <div style={{ fontSize:16, fontWeight:700, color:color||C.text }}>{value}</div>
                    {sub && <div style={{ fontSize:10, color:C.muted, marginTop:4 }}>{sub}</div>}
                </div>
            );
        }

        // ── Matrise ───────────────────────────────────────────────────────────
        function Matrix({ decisions, onOpen }) {
            if (!decisions.length) return <div style={{ padding:"48px 0", textAlign:"center", color:C.muted, fontSize:14 }}>Legg til valg for å se porteføljematrisen.</div>;

            const maxAbs = Math.max(5, ...decisions.map(d => Math.abs(netDebt(d.debts))));
            const eN = decisions.filter(d => getOrient(d) < 45).length;
            const xN = decisions.filter(d => getOrient(d) > 55).length;
            const bN = decisions.length - eN - xN;

            const typeCols = { tech:[C.blueBg, C.blue, C.blueBd], org:["#F0EBFF","#5030A0","#C8B0F0"], process:[C.greenBg, C.green, C.greenBd], design:[C.amberBg, C.amber, C.amberBd] };

            return (
                <div style={{ padding:"20px 22px" }}>
                    <div style={{ fontSize:13, fontWeight:700, color:C.text, marginBottom:4 }}>Porteføljematrise — ambideksteriprofil</div>
                    <div style={{ fontSize:12, color:C.sub, marginBottom:14 }}>Plassering basert på strategisk orientering og netto gjeld.</div>

                    <div style={{ position:"relative", height:290, border:`1px solid ${C.border}`, borderRadius:12, overflow:"hidden", background:C.surface, marginBottom:14 }}>
                        <div style={{ position:"absolute", left:0, top:0, width:"50%", height:"50%", background:C.redBg, padding:"9px 12px" }}>
                            <div style={{ fontSize:11, fontWeight:700, color:C.red }}>Driftspress</div><div style={{ fontSize:10, color:C.muted }}>Høy gjeld · Exploit</div>
                        </div>
                        <div style={{ position:"absolute", left:"50%", top:0, width:"50%", height:"50%", background:"rgba(24,86,160,0.05)", padding:"9px 12px" }}>
                            <div style={{ fontSize:11, fontWeight:700, color:C.blue }}>Innovasjon under press</div><div style={{ fontSize:10, color:C.muted }}>Høy gjeld · Explore</div>
                        </div>
                        <div style={{ position:"absolute", left:0, top:"50%", width:"50%", height:"50%", background:"rgba(13,122,86,0.05)", display:"flex", flexDirection:"column", justifyContent:"flex-end", padding:"9px 12px" }}>
                            <div style={{ fontSize:11, fontWeight:700, color:C.green }}>Effektivisering</div><div style={{ fontSize:10, color:C.muted }}>Amortisering · Exploit</div>
                        </div>
                        <div style={{ position:"absolute", left:"50%", top:"50%", width:"50%", height:"50%", background:"rgba(24,86,160,0.07)", display:"flex", flexDirection:"column", justifyContent:"flex-end", padding:"9px 12px" }}>
                            <div style={{ fontSize:11, fontWeight:700, color:C.blue }}>Skalering</div><div style={{ fontSize:10, color:C.muted }}>Amortisering · Explore</div>
                        </div>

                        <div style={{ position:"absolute", left:"50%", top:0, bottom:0, width:1, background:C.border }} />
                        <div style={{ position:"absolute", top:"50%", left:0, right:0, height:1, background:C.border }} />

                        {decisions.map(d => {
                            const o = getOrient(d);
                            const nd = netDebt(d.debts);
                            const xPct = o;
                            const yPct = 50 - (nd / maxAbs) * 42;
                            const [bg,tc,bd] = typeCols[d.type] || typeCols.tech;
                            return (
                                <div key={d.id} onClick={() => onOpen(d.id)} title={d.name}
                                    style={{ position:"absolute", left:`calc(${xPct}% - 44px)`, top:`calc(${yPct}% - 13px)`, background:bg, border:`1px solid ${bd}`, borderRadius:20, padding:"4px 10px", fontSize:11, fontWeight:600, color:tc, whiteSpace:"nowrap", maxWidth:120, overflow:"hidden", textOverflow:"ellipsis", cursor:"pointer", boxShadow:C.sh, zIndex:2 }}>
                                    {d.name}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        // ── Roadmap ───────────────────────────────────────────────────────────
        function Roadmap({ decisions, onOpen }) {
            if (!decisions.length) return <div style={{ padding:"48px 0", textAlign:"center", color:C.muted, fontSize:14 }}>Legg til valg for å se fasekartet.</div>;
            const phaseColors = { Assimilering:[C.blue,C.blueBg,C.blueBd], Rekonstruksjon:[C.amber,C.amberBg,C.amberBd], Materialisering:[C.green,C.greenBg,C.greenBd] };

            return (
                <div style={{ padding:"20px 22px" }}>
                    <div style={{ fontSize:13, fontWeight:700, color:C.text, marginBottom:4 }}>Fasekart — veikart for ledelsen</div>
                    <div style={{ fontSize:12, color:C.sub, marginBottom:12 }}>Tildel fase til hvert valg i analytikermodusen.</div>
                    <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:12 }}>
                        {PHASES.map((phase, i) => {
                            const list = decisions.filter(d => d.phase === phase);
                            const [tc, bg, bd] = phaseColors[phase] || [C.blue, C.blueBg, C.blueBd];
                            return (
                                <div key={phase}>
                                    <div style={{ background:bg, border:`1px solid ${bd}`, borderRadius:10, padding:"10px 14px", marginBottom:8 }}>
                                        <div style={{ fontSize:13, fontWeight:700, color:tc }}>{i+1}. {phase}</div>
                                    </div>
                                    {list.map(d => (
                                        <div key={d.id} onClick={() => onOpen(d.id)} style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:9, padding:"11px 13px", cursor:"pointer", marginBottom:7 }}>
                                            <div style={{ fontSize:13, fontWeight:600, color:C.text, marginBottom:5 }}>{d.name}</div>
                                            <TypeBadge type={d.type} />
                                        </div>
                                    ))}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        // ── Detail / Analytiker ───────────────────────────────────────────────
        function Detail({ decision, onBack, onUpdate }) {
            const [a, setA] = useState({ phase:decision.phase||"", tension:decision.tension||"", orient:decision.orient??null, notes:decision.notes||"" });
            
            const saveA = () => {
                onUpdate(decision.id, { phase:a.phase||null, tension:a.tension||null, orient:a.orient, notes:a.notes });
                onBack();
            };

            return (
                <div>
                    <button onClick={onBack} style={{ display:"flex", alignItems:"center", gap:7, padding:"8px 15px", background:C.surface, color:C.sub, border:`1px solid ${C.border}`, borderRadius:8, fontSize:14, cursor:"pointer", marginBottom:20 }}><Icon name="arrow-left" size={14}/> Dashboard</button>
                    <h2>{decision.name}</h2>
                    <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:20 }}>
                        <Card style={{ padding:18 }}>
                            <h4>Analytikermodusen</h4>
                            <Lbl t="Transformasjonsfase" />
                            <select style={{...IS, marginBottom:15}} value={a.phase} onChange={e => setA(p => ({ ...p, phase:e.target.value }))}>
                                <option value="">Ikke tildelt</option>
                                {PHASES.map(p => <option key={p}>{p}</option>)}
                            </select>
                            
                            <Lbl t="Paradoksal spenning" />
                            <select style={{...IS, marginBottom:15}} value={a.tension} onChange={e => setA(p => ({ ...p, tension:e.target.value }))}>
                                <option value="">Ikke tildelt</option>
                                {TENSIONS.map(x => <option key={x.k} value={x.k}>{x.l} — {x.d}</option>)}
                            </select>

                            <button onClick={saveA} style={{ width:"100%", padding:"10px", background:C.green, color:"#FFF", border:"none", borderRadius:8, cursor:"pointer", fontWeight:600 }}><Icon name="check" size={14}/> Lagre dimensjoner</button>
                        </Card>
                    </div>
                </div>
            );
        }

        // ── Dashboard ─────────────────────────────────────────────────────────
        function Dashboard({ decisions, onNew, onDelete, onOpen }) {
            const chartData = DEBTS.map(cat => ({ name:cat.s, Gjeld: decisions.reduce((a,b) => a + (b.debts[cat.k]||0), 0) }));
            const nd = decisions.reduce((a,b)=>a+netDebt(b.debts), 0);

            return (
                <div style={{ display:"flex", flexDirection:"column", gap:24 }}>
                    <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:14 }}>
                        <Stat label="Registrerte tiltak" value={decisions.length} />
                        <Stat label="Netto porteføljegjeld" value={(nd>0?"+":"")+nd} color={nd<0?C.green:nd>0?C.red:C.sub} bg={nd<0?C.greenBg:nd>0?C.redBg:C.raised} />
                        <button onClick={onNew} style={{ background:C.green, color:"#FFF", border:"none", borderRadius:10, fontWeight:600, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", gap:8 }}><Icon name="plus" size={16}/> Ny beslutning</button>
                    </div>

                    <div style={{ display:"grid", gridTemplateColumns:"1.4fr 1fr", gap:20 }}>
                        <div>
                            {decisions.map(d => (
                                <div key={d.id} onClick={() => onOpen(d.id)} style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:10, padding:"14px 18px", cursor:"pointer", display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
                                    <div>
                                        <div style={{ fontWeight:700, marginBottom:6 }}>{d.name}</div>
                                        <TypeBadge type={d.type} /> {d.phase && <Tag color="blue" text={d.phase} />}
                                    </div>
                                    <div style={{ display:"flex", alignItems:"center", gap:16 }}>
                                        <span style={{ fontWeight:700, color:netDebt(d.debts)>0?C.red:C.green }}>{netDebt(d.debts)>0?"+":""}{netDebt(d.debts)}</span>
                                        <button onClick={e => { e.stopPropagation(); onDelete(d.id); }} style={{ background:"none", border:"none", cursor:"pointer" }}><Icon name="trash-2" size={16} className="text-muted"/></button>
                                    </div>
                                </div>
                            ))}
                        </div>
                        <Card style={{ padding:"18px 12px" }}>
                            <div style={{ height:210 }}>
                                <ResponsiveContainer>
                                    <BarChart data={chartData} margin={{ top:5, right:5, left:-25, bottom:5 }}>
                                        <XAxis dataKey="name" stroke={C.sub} fontSize={10} tickLine={false} />
                                        <YAxis stroke={C.sub} fontSize={10} tickLine={false} />
                                        <Tooltip content={<ChartTT />} cursor={{ fill:C.raised }} />
                                        <Bar dataKey="Gjeld">
                                            {chartData.map((entry, idx) => <Cell key={idx} fill={entry.Gjeld < 0 ? C.green : entry.Gjeld > 0 ? C.red : C.muted} />)}
                                        </Bar>
                                    </BarChart>
                                </ResponsiveContainer>
                            </div>
                        </Card>
                    </div>

                    <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:20 }}>
                        <Card><Matrix decisions={decisions} onOpen={onOpen} /></Card>
                        <Card><Roadmap decisions={decisions} onOpen={onOpen} /></Card>
                    </div>
                </div>
            );
        }

        // ── Wizard (Opprett nytt) ─────────────────────────────────────────────
        function Wizard({ onCancel, onSave }) {
            const [d, setD] = useState({ name:"", type:"tech", debts:emptyD() });
            
            return (
                <Card style={{ maxWidth:640, margin:"0 auto", padding:24 }}>
                    <h3>Opprett nytt tiltak</h3>
                    <Lbl t="Navn" />
                    <input type="text" style={{...IS, marginBottom:16}} value={d.name} onChange={e => setD({...d, name:e.target.value})} />
                    
                    <Lbl t="Gjeldskonfigurasjon (-5 til +5)" />
                    {DEBTS.map(cat => (
                        <div key={cat.k} style={{ marginBottom:10 }}>
                            <div style={{ display:"flex", justifyContent:"space-between", fontSize:12 }}>
                                <span>{cat.n}</span><span style={{ fontWeight:700 }}>{d.debts[cat.k] || 0}</span>
                            </div>
                            <input type="range" min="-5" max="5" value={d.debts[cat.k] || 0} onChange={e => setD({...d, debts:{...d.debts, [cat.k]:parseInt(e.target.value)}})} style={{ width:"100%" }} />
                        </div>
                    ))}
                    
                    <div style={{ display:"flex", gap:10, marginTop:20 }}>
                        <button onClick={onCancel} style={{ flex:1, padding:10, background:C.raised, border:"none", borderRadius:8 }}>Avbryt</button>
                        <button onClick={() => onSave({...d, id:Date.now()})} style={{ flex:1, padding:10, background:C.green, color:"#FFF", border:"none", borderRadius:8 }}>Lagre tiltak</button>
                    </div>
                </Card>
            );
        }

        // ── Hovedapplikasjon (inkl. LocalStorage) ─────────────────────────────
        function PlatformDebtTool() {
            const [view, setView] = useState("dashboard");
            const [selectedId, setSelectedId] = useState(null);
            
            // Last inn fra nettleserens lagring
            const [decisions, setDecisions] = useState(() => {
                const saved = localStorage.getItem("platform_decisions_v2");
                if (saved) return JSON.parse(saved);
                return [
                    { id: 1, name: "CI/CD Pipeline", type: "process", phase: "Assimilering", debts: { ideology: 0, competence: -2, working_env: -3, user_sat: -1, reputation: -1, infra: -2, shadow_it: -2, technical: -3, governance: -1 } }
                ];
            });

            // Lagre til nettleseren ved endring
            useEffect(() => { localStorage.setItem("platform_decisions_v2", JSON.stringify(decisions)); }, [decisions]);

            const add = d => { setDecisions([...decisions, d]); setView("dashboard"); };
            const del = id => setDecisions(decisions.filter(x => x.id !== id));
            const open = id => { setSelectedId(id); setView("detail"); };
            const update = (id, fields) => setDecisions(decisions.map(x => x.id === id ? { ...x, ...fields } : x));

            const activeD = decisions.find(x => x.id === selectedId);

            return (
                <div style={{ background:C.bg, minHeight:"100vh" }}>
                    <header style={{ background:C.surface, borderBottom:`1px solid ${C.border}`, padding:"13px 24px", display:"flex", alignItems:"center", gap:10 }}>
                        <div style={{ width:30, height:30, borderRadius:8, background:C.green, display:"flex", alignItems:"center", justifyContent:"center" }}>
                            <span style={{ color:"#FFF", fontSize:14, fontWeight:800 }}>P</span>
                        </div>
                        <span style={{ fontSize:15, fontWeight:700 }}>Platform Decision Tool</span>
                    </header>
                    <main style={{ maxWidth:980, margin:"0 auto", padding:"32px 28px" }}>
                        {view === "dashboard" && <Dashboard decisions={decisions} onNew={() => setView("wizard")} onDelete={del} onOpen={open} />}
                        {view === "wizard"    && <Wizard onCancel={() => setView("dashboard")} onSave={add} />}
                        {view === "detail"    && activeD && <Detail decision={activeD} onBack={() => setView("dashboard")} onUpdate={update} />}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PlatformDebtTool />);
    </script>
</body>
</html>
